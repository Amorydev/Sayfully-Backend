[project]
name = "sayfully-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<5.2",
    "django-ninja>=1.3",
    "email-validator>=2.2",
    "psycopg[binary]>=3.2",
    "django-environ>=0.11",
    "argon2-cffi>=23.1",
    "pyjwt[crypto]>=2.9",
    "google-auth>=2.35",
    "django-cors-headers>=4.4",
    "django-q2>=1.7",
    "boto3>=1.35",
    "fsrs>=6.3",
    "resend>=2.4",
    "sentry-sdk[django]>=2.17",
    "django-ratelimit>=4.1",
    "gunicorn>=23.0",
    "cmudict>=1.1.3",
    "pyphen>=0.18.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "time-machine>=2.15",
    "responses>=0.25",
    "ruff>=0.7",
]

[tool.uv]
# Đây là ứng dụng Django, không phải thư viện -> không tự cài project làm package
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["ninja.Query", "ninja.File"]  # idiom ninja: Query/File trong default

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py"]
addopts = "-q --reuse-db"
